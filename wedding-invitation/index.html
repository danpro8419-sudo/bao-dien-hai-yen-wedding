<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Admin — Bảo Điền & Hải Yến</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
</head>
<body>
<div id="loginView" class="view">
  <section class="login-card">
    <p class="eyebrow">BẢO ĐIỀN & HẢI YẾN · 03.01.2027</p>
    <h1>Wedding Admin</h1>
    <p class="muted">Đăng nhập để quản lý ảnh, video và RSVP.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="email" required></label>
      <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">ĐĂNG NHẬP</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>
</div>

<div id="appView" class="hidden">
<header class="topbar">
  <div><p class="eyebrow">BẢO ĐIỀN & HẢI YẾN</p><h1>Wedding Admin</h1></div>
  <div class="top-actions"><span id="adminEmail"></span><button id="logoutBtn" class="ghost">Đăng xuất</button></div>
</header>
<main class="dashboard">
  <section class="stats">
    <article><span>CHỜ DUYỆT</span><strong id="pendingCount">0</strong></article>
    <article><span>ĐÃ DUYỆT</span><strong id="approvedCount">0</strong></article>
    <article><span>RSVP</span><strong id="rsvpCount">0</strong></article>
  </section>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">GUEST MEMORIES</p><h2>Ảnh & video chờ duyệt</h2></div><button id="refreshBtn" class="ghost">Làm mới</button></div>
    <div id="pendingList" class="media-grid"><p class="muted">Đang tải…</p></div>
  </section>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">RSVP</p><h2>Khách mời</h2></div></div>
    <div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Tên</th><th>Tham dự</th><th>Số người</th><th>Lời nhắn</th></tr></thead><tbody id="rsvpList"></tbody></table></div>
  </section>
</main>
</div>
<script src="admin.js"></script>
</body></html>
